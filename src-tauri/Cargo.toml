[package]
name = "gt1-editor"
version = "0.1.0"
description = "Offline patch editor for the BOSS GT-1"
authors = ["GT-1 Editor contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "gt1_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
